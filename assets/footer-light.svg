<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="72" viewBox="0 0 1280 72" role="img" aria-label="emilio-guadarrama-portfolio.vercel.app">
  <title>Open the portfolio</title>
  <style>
    @font-face { font-family: 'EG Mono'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
    .mono { font-family: 'EG Mono', 'JetBrains Mono', Consolas, Menlo, monospace; }
    .line { fill: none; stroke: #c4c4c4; stroke-width: 3; stroke-linecap: square; }
    .sig { fill: none; stroke: #070707; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 200; stroke-dashoffset: 6; animation: run 5s linear infinite; opacity: 0; }
    .sig.b { animation-delay: -2.5s; }
    @keyframes run { 0% { stroke-dashoffset: 6; opacity: 1; } 100% { stroke-dashoffset: -100; opacity: 1; } }
    .via { fill: #ffffff; stroke: #9a9a9a; stroke-width: 2.5; }
    @media (prefers-reduced-motion: reduce) { .sig { animation: none; opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" width="1279" height="71" fill="#ffffff" stroke="#d8d8d8"/>
  <path class="line" d="M64 36 H400"/>
  <path class="sig" d="M64 36 H400" pathLength="100"/>
  <path class="sig b" d="M64 36 H400" pathLength="100"/>
  <circle class="via" cx="64" cy="36" r="6"/>
  <text class="mono" x="640" y="41" text-anchor="middle" font-size="15" letter-spacing="1.5" fill="#5c5c5c">emilio-guadarrama-portfolio.vercel.app</text>
  <path class="line" d="M880 36 H1216"/>
  <path class="sig" d="M1216 36 H880" pathLength="100"/>
  <path class="sig b" d="M1216 36 H880" pathLength="100"/>
  <circle class="via" cx="1216" cy="36" r="6"/>
</svg>
